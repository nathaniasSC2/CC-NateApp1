<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing DVD Logo - Super Saiyan 3 Edition</title>
    <style>
        :root {
            /* Theme: Classic */
            --glow-color: currentColor;
            --glow-intensity: 0px;
            --scanline-opacity: 0;
            --bg-color: transparent;
            /* Power Level System */
            --aura-color: transparent;
            --aura-intensity: 0;
            --transformation-scale: 1;
            --hair-length: 0;
        }

        /* Theme Presets */
        .theme-classic { --glow-intensity: 0px; --scanline-opacity: 0; }
        .theme-retrowave { --glow-intensity: 20px; --scanline-opacity: 0.15; }
        .theme-vaporwave { --glow-intensity: 30px; --scanline-opacity: 0.1; }
        .theme-minimal { --glow-intensity: 5px; --scanline-opacity: 0; }
        .theme-crt { --glow-intensity: 15px; --scanline-opacity: 0.25; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* CRT Scanlines Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            opacity: var(--scanline-opacity);
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
        }

        /* Fireworks Canvas */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .dvd-logo {
            position: absolute;
            width: 150px;
            height: 80px;
            transition: filter 0.3s ease;
            filter: drop-shadow(0 0 var(--glow-intensity) var(--glow-color));
            z-index: 100;
        }

        .dvd-logo svg {
            width: 100%;
            height: 100%;
        }

        /* Neon Glow Pulse Animation */
        @keyframes glowPulse {
            0%, 100% { filter: drop-shadow(0 0 var(--glow-intensity) var(--glow-color)); }
            50% { filter: drop-shadow(0 0 calc(var(--glow-intensity) * 1.5) var(--glow-color)); }
        }

        .glow-enabled {
            animation: glowPulse 2s ease-in-out infinite;
        }

        /* Corner hit celebration effect */
        .corner-hit {
            animation: cornerCelebration 0.5s ease-out;
        }

        @keyframes cornerCelebration {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Screen Shake */
        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-5px, -5px); }
            20% { transform: translate(5px, -5px); }
            30% { transform: translate(-5px, 5px); }
            40% { transform: translate(5px, 5px); }
            50% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, -3px); }
            70% { transform: translate(-3px, 3px); }
            80% { transform: translate(3px, 3px); }
            90% { transform: translate(-1px, -1px); }
        }

        .screen-shake {
            animation: screenShake 0.4s ease-out;
        }

        /* The Prophecy indicator */
        .prophecy-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700, 0 0 40px #ffd700;
            opacity: 0;
            pointer-events: none;
            z-index: 1001;
            transition: opacity 0.3s ease;
            text-align: center;
        }

        .prophecy-indicator.active {
            opacity: 1;
            animation: prophecyPulse 0.5s ease-in-out infinite;
        }

        @keyframes prophecyPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Stats overlay */
        .stats {
            position: fixed;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
            display: none;
            z-index: 1002;
            min-width: 200px;
        }

        .stats.visible { display: block; }

        .stats-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .corner-count {
            color: #ffd700;
            font-weight: bold;
            font-size: 18px;
        }

        .streak-display {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .drought-counter {
            color: #ff6b6b;
        }

        .streak-counter {
            color: #4ecdc4;
        }

        /* Midnight Mode */
        .midnight-mode .dvd-logo {
            filter: drop-shadow(0 0 30px #8b00ff) drop-shadow(0 0 60px #4b0082);
        }

        .midnight-mode .scanlines {
            opacity: 0.3;
            background: repeating-linear-gradient(
                0deg,
                rgba(75, 0, 130, 0.2),
                rgba(75, 0, 130, 0.2) 1px,
                transparent 1px,
                transparent 2px
            );
        }

        /* Config Panel */
        .config-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 12px;
            color: white;
            font-size: 12px;
            z-index: 1003;
            display: none;
            max-width: 300px;
        }

        .config-panel.visible { display: block; }

        .config-panel h3 {
            margin-bottom: 15px;
            color: #ffd700;
        }

        .config-row {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .config-panel select, .config-panel input {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 5px;
            border-radius: 4px;
        }

        /* Help overlay */
        .help-overlay {
            position: fixed;
            bottom: 10px;
            left: 10px;
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            z-index: 1001;
        }

        /* ============================================
           POWER LEVEL SYSTEM - SAIYAN TRANSFORMATIONS
           ============================================ */

        /* Power Level Scouter Display */
        .power-scouter {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1002;
            font-family: 'Courier New', monospace;
            pointer-events: none;
            opacity: 0.9;
        }

        .scouter-frame {
            background: linear-gradient(135deg, rgba(20,20,30,0.95) 0%, rgba(40,40,60,0.9) 100%);
            border: 2px solid #00ff88;
            border-radius: 10px 30px 10px 10px;
            padding: 12px 20px;
            min-width: 180px;
            box-shadow: 0 0 20px rgba(0,255,136,0.3), inset 0 0 30px rgba(0,0,0,0.5);
        }

        .scouter-lens {
            position: absolute;
            top: -5px;
            right: -15px;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, rgba(0,255,136,0.8), rgba(0,100,50,0.6));
            border-radius: 50%;
            border: 2px solid #00ff88;
            box-shadow: 0 0 15px rgba(0,255,136,0.5);
        }

        .power-label {
            font-size: 10px;
            color: #00ff88;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .power-value {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px currentColor;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .power-bar-container {
            margin-top: 8px;
            height: 6px;
            background: rgba(0,0,0,0.5);
            border-radius: 3px;
            overflow: hidden;
        }

        .power-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff88, #ffff00);
            border-radius: 3px;
            transition: width 0.3s ease, background 0.5s ease;
        }

        .transformation-name {
            font-size: 11px;
            color: #ffd700;
            text-align: center;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            opacity: 0.9;
        }

        /* Transformation-specific scouter colors */
        .scouter-frame.base { border-color: #888; }
        .scouter-frame.base .power-value { color: #fff; }
        .scouter-frame.base .power-bar { background: linear-gradient(90deg, #666, #aaa); }

        .scouter-frame.super-dvd { border-color: #ffd700; box-shadow: 0 0 25px rgba(255,215,0,0.4); }
        .scouter-frame.super-dvd .power-value { color: #ffd700; text-shadow: 0 0 15px #ffd700; }
        .scouter-frame.super-dvd .power-bar { background: linear-gradient(90deg, #ffd700, #ffff00); }

        .scouter-frame.super-dvd-2 { border-color: #00bfff; box-shadow: 0 0 30px rgba(0,191,255,0.5); }
        .scouter-frame.super-dvd-2 .power-value { color: #00bfff; text-shadow: 0 0 20px #00bfff; }
        .scouter-frame.super-dvd-2 .power-bar { background: linear-gradient(90deg, #ffd700, #00bfff); }

        .scouter-frame.super-dvd-3 { border-color: #ff4500; box-shadow: 0 0 40px rgba(255,69,0,0.6); }
        .scouter-frame.super-dvd-3 .power-value { color: #ff4500; text-shadow: 0 0 25px #ff4500; }
        .scouter-frame.super-dvd-3 .power-bar { background: linear-gradient(90deg, #ff4500, #ff0000); }

        .scouter-frame.ultra-instinct {
            border-color: #e0e0e0;
            box-shadow: 0 0 50px rgba(200,200,255,0.7), 0 0 100px rgba(150,150,255,0.3);
            animation: ultraFlicker 0.1s infinite;
        }
        .scouter-frame.ultra-instinct .power-value { color: #e0e0ff; text-shadow: 0 0 30px #c0c0ff, 0 0 60px #8080ff; }
        .scouter-frame.ultra-instinct .power-bar { background: linear-gradient(90deg, #c0c0ff, #ffffff, #c0c0ff); }

        .scouter-frame.legendary {
            border-color: #00ff00;
            box-shadow: 0 0 60px rgba(0,255,0,0.8), 0 0 120px rgba(0,255,0,0.4);
            animation: legendaryPulse 0.5s infinite;
        }
        .scouter-frame.legendary .power-value { color: #00ff00; text-shadow: 0 0 40px #00ff00; }
        .scouter-frame.legendary .power-bar { background: linear-gradient(90deg, #00ff00, #88ff00, #00ff00); }

        @keyframes ultraFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
        }

        @keyframes legendaryPulse {
            0%, 100% { box-shadow: 0 0 60px rgba(0,255,0,0.8), 0 0 120px rgba(0,255,0,0.4); }
            50% { box-shadow: 0 0 80px rgba(0,255,0,1), 0 0 160px rgba(0,255,0,0.6); }
        }

        /* Aura Effects on Logo */
        .dvd-logo.has-aura {
            position: relative;
        }

        .aura-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: -1;
        }

        /* Base Form - No Aura */
        .aura-base { display: none; }

        /* Super DVD - Golden Aura */
        .aura-super {
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center,
                rgba(255,215,0,0.4) 0%,
                rgba(255,215,0,0.2) 30%,
                rgba(255,215,0,0) 70%);
            animation: auraFlare 1s ease-in-out infinite;
        }

        /* Super DVD 2 - Electric Blue Aura */
        .aura-super2 {
            width: 220%;
            height: 220%;
            background: radial-gradient(ellipse at center,
                rgba(0,191,255,0.5) 0%,
                rgba(255,215,0,0.3) 20%,
                rgba(0,191,255,0.2) 40%,
                transparent 70%);
            animation: auraFlare 0.8s ease-in-out infinite, electricSparks 0.15s infinite;
        }

        /* Super DVD 3 - Intense Red/Orange with Ground Shake */
        .aura-super3 {
            width: 280%;
            height: 280%;
            background: radial-gradient(ellipse at center,
                rgba(255,100,0,0.6) 0%,
                rgba(255,50,0,0.4) 25%,
                rgba(255,215,0,0.2) 50%,
                transparent 70%);
            animation: auraFlare 0.5s ease-in-out infinite, ssj3Rage 0.3s infinite;
        }

        /* Ultra Instinct - Silver/White Ethereal */
        .aura-ultra {
            width: 300%;
            height: 300%;
            background: radial-gradient(ellipse at center,
                rgba(220,220,255,0.7) 0%,
                rgba(180,180,255,0.4) 30%,
                rgba(150,150,255,0.2) 50%,
                transparent 70%);
            animation: ultraAura 2s ease-in-out infinite;
        }

        /* Legendary Super DVD - Massive Green */
        .aura-legendary {
            width: 400%;
            height: 400%;
            background: radial-gradient(ellipse at center,
                rgba(0,255,0,0.8) 0%,
                rgba(100,255,0,0.5) 20%,
                rgba(0,255,0,0.3) 40%,
                rgba(150,255,0,0.1) 60%,
                transparent 80%);
            animation: legendaryAura 0.4s ease-in-out infinite;
        }

        @keyframes auraFlare {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        @keyframes electricSparks {
            0%, 100% { filter: brightness(1); }
            25% { filter: brightness(1.3); }
            75% { filter: brightness(0.9); }
        }

        @keyframes ssj3Rage {
            0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            25% { transform: translate(-51%, -49%) scale(1.05) rotate(1deg); }
            75% { transform: translate(-49%, -51%) scale(1.03) rotate(-1deg); }
        }

        @keyframes ultraAura {
            0%, 100% { transform: translate(-50%, -50%) scale(1); filter: hue-rotate(0deg); }
            50% { transform: translate(-50%, -50%) scale(1.05); filter: hue-rotate(10deg); }
        }

        @keyframes legendaryAura {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); }
        }

        /* Logo Transformation Styles */
        .dvd-logo.super-dvd svg { filter: drop-shadow(0 0 20px #ffd700) drop-shadow(0 0 40px #ffd700); }
        .dvd-logo.super-dvd-2 svg { filter: drop-shadow(0 0 25px #00bfff) drop-shadow(0 0 50px #ffd700); }
        .dvd-logo.super-dvd-3 svg {
            filter: drop-shadow(0 0 30px #ff4500) drop-shadow(0 0 60px #ff0000);
            animation: ssj3Intensity 0.3s infinite;
        }
        .dvd-logo.ultra-instinct svg {
            filter: drop-shadow(0 0 35px #c0c0ff) drop-shadow(0 0 70px #8080ff);
            animation: ultraGlow 1.5s ease-in-out infinite;
        }
        .dvd-logo.legendary svg {
            filter: drop-shadow(0 0 50px #00ff00) drop-shadow(0 0 100px #00ff00);
            animation: legendaryGlow 0.4s infinite;
        }

        @keyframes ssj3Intensity {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes ultraGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.9; }
        }

        @keyframes legendaryGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 50px #00ff00) drop-shadow(0 0 100px #00ff00); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 70px #00ff00) drop-shadow(0 0 140px #00ff00); }
        }

        /* Transformation Flash Effect */
        .transformation-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .transformation-flash.active {
            opacity: 1;
            animation: transformFlash 1s ease-out forwards;
        }

        @keyframes transformFlash {
            0% { opacity: 1; background: white; }
            20% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        /* Power Up Charging Effect */
        .charging-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1500;
            opacity: 0;
        }

        .charging-overlay.active {
            opacity: 1;
            animation: chargingPulse 0.5s ease-in-out infinite;
        }

        @keyframes chargingPulse {
            0%, 100% { background: radial-gradient(circle at center, transparent 40%, rgba(255,215,0,0.1) 100%); }
            50% { background: radial-gradient(circle at center, transparent 30%, rgba(255,215,0,0.2) 100%); }
        }

        /* SSJ3 Ground Shake */
        .ground-shake {
            animation: groundShake 0.15s infinite;
        }

        @keyframes groundShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-3px, 2px); }
            50% { transform: translate(2px, -3px); }
            75% { transform: translate(-2px, -2px); }
        }

        /* Transformation Announcement */
        .transformation-announce {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 48px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 30px currentColor, 0 0 60px currentColor;
            text-align: center;
            pointer-events: none;
            z-index: 2001;
            opacity: 0;
            white-space: nowrap;
        }

        .transformation-announce.active {
            animation: announceTransform 2s ease-out forwards;
        }

        @keyframes announceTransform {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        /* Hair Extension for SSJ3 (visual element added to logo) */
        .ssj3-hair {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .ssj3-hair.active {
            opacity: 1;
        }

        /* Power decay warning */
        .power-decay-warning {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #ff6b6b;
            text-shadow: 0 0 10px #ff0000;
            opacity: 0;
            pointer-events: none;
            z-index: 1003;
            transition: opacity 0.3s;
        }

        .power-decay-warning.active {
            opacity: 1;
            animation: decayBlink 0.5s infinite;
        }

        @keyframes decayBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Energy Particles around logo during high power */
        .energy-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
        }

        @keyframes energyOrbit {
            0% { transform: rotate(0deg) translateX(50px) rotate(0deg); opacity: 1; }
            50% { opacity: 0.5; }
            100% { transform: rotate(360deg) translateX(50px) rotate(-360deg); opacity: 1; }
        }

        /* Aura container positioning */
        .aura-container {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            width: 300px;
            height: 200px;
            margin-left: -150px;
            margin-top: -100px;
        }

        /* ============================================
           SECRET TIER: OMNI DVD - THE ULTIMATE FORM
           ============================================ */
        .scouter-frame.omni-dvd {
            border-color: #ff00ff;
            background: linear-gradient(135deg, rgba(255,0,255,0.3) 0%, rgba(0,255,255,0.3) 50%, rgba(255,255,0,0.3) 100%);
            box-shadow: 0 0 80px rgba(255,0,255,0.9), 0 0 160px rgba(0,255,255,0.6), 0 0 240px rgba(255,255,0,0.4);
            animation: omniPulse 0.3s infinite, omniRainbow 2s linear infinite;
        }
        .scouter-frame.omni-dvd .power-value {
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: omniTextFlow 1s linear infinite;
        }
        .scouter-frame.omni-dvd .power-bar {
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
            background-size: 300% 100%;
            animation: omniBarFlow 1s linear infinite;
        }

        @keyframes omniPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes omniRainbow {
            0% { border-color: #ff00ff; }
            33% { border-color: #00ffff; }
            66% { border-color: #ffff00; }
            100% { border-color: #ff00ff; }
        }

        @keyframes omniTextFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        @keyframes omniBarFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* OMNI DVD Aura - Reality-bending */
        .aura-omni {
            width: 500%;
            height: 500%;
            background:
                radial-gradient(ellipse at center, rgba(255,0,255,0.6) 0%, transparent 50%),
                radial-gradient(ellipse at 30% 30%, rgba(0,255,255,0.4) 0%, transparent 40%),
                radial-gradient(ellipse at 70% 70%, rgba(255,255,0,0.4) 0%, transparent 40%);
            animation: omniAura 0.3s ease-in-out infinite, omniRotate 5s linear infinite;
        }

        @keyframes omniAura {
            0%, 100% { transform: translate(-50%, -50%) scale(1); filter: hue-rotate(0deg); }
            50% { transform: translate(-50%, -50%) scale(1.2); filter: hue-rotate(60deg); }
        }

        @keyframes omniRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* OMNI Logo style */
        .dvd-logo.omni-dvd svg {
            filter: drop-shadow(0 0 60px #ff00ff) drop-shadow(0 0 80px #00ffff) drop-shadow(0 0 100px #ffff00);
            animation: omniGlow 0.3s infinite;
        }

        @keyframes omniGlow {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 60px #ff00ff) drop-shadow(0 0 80px #00ffff) drop-shadow(0 0 100px #ffff00);
            }

                announcement: 'SUPER DVD 3!!!',
                groundShake: true,  // THE GROUND SHAKES
                audioFreqBase: 400
            },
            ultraInstinct: {
                name: 'ULTRA INSTINCT',
                threshold: POWER_CONFIG.thresholds.ultraInstinct,
                color: '#c0c0ff',
                auraClass: 'aura-ultra',
                logoClass: 'ultra-instinct',
                scouterClass: 'ultra-instinct',
                speedMultiplier: 1.3, // Calm, controlled speed
                announcement: 'ULTRA INSTINCT...',

            },
            legendary: {

        };

        // Power Level DOM Elements
        let powerValueEl, powerBarEl, scouterFrameEl, transformNameEl;
        let transformFlashEl, chargingOverlayEl, transformAnnounceEl, decayWarningEl;
        let auraContainerEl, powerScouterEl;

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const logo = document.getElementById('dvdLogo');
        const logoGroup = document.getElementById('logoGroup');
        const statsEl = document.getElementById('stats');
        const edgeHitsEl = document.getElementById('edgeHits');
        const cornerHitsEl = document.getElementById('cornerHits');

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            // Apply theme
            document.body.className = `theme-${CONFIG.theme}`;
            CONFIG.colors = CONFIG.themes[CONFIG.theme] || CONFIG.themes.classic;

            // Setup canvas
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Set initial color
            logoGroup.style.color = CONFIG.colors[currentColorIndex];
            document.documentElement.style.setProperty('--glow-color', CONFIG.colors[currentColorIndex]);

            // Show stats if configured
            if (CONFIG.showStats) statsEl.classList.add('visible');

            // Setup config panel controls
            setupConfigPanel();

            // Check for midnight mode
            checkMidnightMode();
            setInterval(checkMidnightMode, 60000);

            // Initialize audio context on first interaction
            document.addEventListener('click', initAudio, { once: true });
            document.addEventListener('keydown', initAudio, { once: true });

            // Initialize lore system
            initLore();
        }

        // ============================================
        // AUDIO SYSTEM (Web Audio API)
        // ============================================
        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();

            // Setup drone oscillator (but don't start it)
            droneOscillator = audioContext.createOscillator();
            droneGain = audioContext.createGain();
            droneOscillator.type = 'sine';
            droneOscillator.frequency.value = 60;
            droneGain.gain.value = 0;
            droneOscillator.connect(droneGain);
            droneGain.connect(audioContext.destination);
            droneOscillator.start();
        }

        function playCornerChime() {
            if (!audioContext || !CONFIG.sound) return;

            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1760, audioContext.currentTime + 0.1);
            osc.frequency.exponentialRampToValueAtTime(880, audioContext.currentTime + 0.3);

            gain.gain.setValueAtTime(0.3, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.5);
        }

        function playEdgeTap() {
            if (!audioContext || !CONFIG.sound) return;

            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();

            osc.type = 'triangle';
            osc.frequency.value = 150 + Math.random() * 50;

            gain.gain.setValueAtTime(0.05, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);

            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.1);
        }

        function updateTensionDrone(proximity) {
            if (!droneGain || !CONFIG.drone) return;

            // Proximity is 0-1, where 1 is very close to corner
            const targetGain = proximity * 0.15;
            const targetFreq = 60 + proximity * 200;

            droneGain.gain.linearRampToValueAtTime(targetGain, audioContext.currentTime + 0.1);
            droneOscillator.frequency.linearRampToValueAtTime(targetFreq, audioContext.currentTime + 0.1);
        }

        // ============================================
        // POWER LEVEL AUDIO SYSTEM
        // ============================================

        let transformationOscillators = [];

        function playTransformationSound(transformation) {
            if (!audioContext || !CONFIG.sound) return;

            const trans = TRANSFORMATIONS[transformation];
            if (!trans || trans.audioFreqBase === 0) return;

            // Clear any existing transformation sounds
            transformationOscillators.forEach(osc => {
                try { osc.stop(); } catch(e) {}
            });
            transformationOscillators = [];

            // Create dramatic ascending transformation sound
            const duration = transformation === 'legendary' ? 3 : 2;
            const baseFreq = trans.audioFreqBase;

            // Main transformation tone
            const osc1 = audioContext.createOscillator();
            const gain1 = audioContext.createGain();
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(baseFreq * 0.5, audioContext.currentTime);
            osc1.frequency.exponentialRampToValueAtTime(baseFreq * 2, audioContext.currentTime + duration * 0.7);
            gain1.gain.setValueAtTime(0, audioContext.currentTime);
            gain1.gain.linearRampToValueAtTime(0.2, audioContext.currentTime + 0.3);
            gain1.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + duration * 0.5);
            gain1.gain.linearRampToValueAtTime(0, audioContext.currentTime + duration);
            osc1.connect(gain1);
            gain1.connect(audioContext.destination);
            osc1.start();
            osc1.stop(audioContext.currentTime + duration);
            transformationOscillators.push(osc1);

            // Harmonic layer
            const osc2 = audioContext.createOscillator();
            const gain2 = audioContext.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(baseFreq, audioContext.currentTime);
            osc2.frequency.exponentialRampToValueAtTime(baseFreq * 3, audioContext.currentTime + duration * 0.8);
            gain2.gain.setValueAtTime(0, audioContext.currentTime);
            gain2.gain.linearRampToValueAtTime(0.15, audioContext.currentTime + 0.5);
            gain2.gain.linearRampToValueAtTime(0, audioContext.currentTime + duration);
            osc2.connect(gain2);
            gain2.connect(audioContext.destination);
            osc2.start();
            osc2.stop(audioContext.currentTime + duration);
            transformationOscillators.push(osc2);

            // SSJ3 and Legendary get extra dramatic elements
            if (transformation === 'superDvd3' || transformation === 'legendary') {
                // Low rumble
                const osc3 = audioContext.createOscillator();
                const gain3 = audioContext.createGain();
                osc3.type = 'sine';
                osc3.frequency.value = 40;
                gain3.gain.setValueAtTime(0, audioContext.currentTime);
                gain3.gain.linearRampToValueAtTime(0.4, audioContext.currentTime + 0.5);
                gain3.gain.linearRampToValueAtTime(0.2, audioContext.currentTime + duration * 0.8);
                gain3.gain.linearRampToValueAtTime(0, audioContext.currentTime + duration);
                osc3.connect(gain3);
                gain3.connect(audioContext.destination);
                osc3.start();
                osc3.stop(audioContext.currentTime + duration);
                transformationOscillators.push(osc3);
            }

            // Ultra Instinct gets ethereal sound
            if (transformation === 'ultraInstinct') {
                const osc4 = audioContext.createOscillator();
                const gain4 = audioContext.createGain();
                const filter = audioContext.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 800;
                osc4.type = 'sine';
                osc4.frequency.setValueAtTime(800, audioContext.currentTime);
                osc4.frequency.linearRampToValueAtTime(1200, audioContext.currentTime + duration);
                gain4.gain.setValueAtTime(0, audioContext.currentTime);
                gain4.gain.linearRampToValueAtTime(0.1, audioContext.currentTime + 1);
                gain4.gain.linearRampToValueAtTime(0, audioContext.currentTime + duration);
                osc4.connect(filter);
                filter.connect(gain4);
                gain4.connect(audioContext.destination);
                osc4.start();
                osc4.stop(audioContext.currentTime + duration);
                transformationOscillators.push(osc4);
            }

            // OMNI DVD - Reality-warping sound
            if (transformation === 'omniDvd') {
                const omniDuration = 4;

                // Ultra-deep bass
                const bassOsc = audioContext.createOscillator();
                const bassGain = audioContext.createGain();
                bassOsc.type = 'sine';
                bassOsc.frequency.value = 25;
                bassGain.gain.setValueAtTime(0, audioContext.currentTime);
                bassGain.gain.linearRampToValueAtTime(0.5, audioContext.currentTime + 1);
                bassGain.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + omniDuration);
                bassOsc.connect(bassGain);
                bassGain.connect(audioContext.destination);
                bassOsc.start();
                bassOsc.stop(audioContext.currentTime + omniDuration);
                transformationOscillators.push(bassOsc);

                // Ascending harmonic series
                for (let i = 0; i < 5; i++) {
                    const harmOsc = audioContext.createOscillator();
                    const harmGain = audioContext.createGain();
                    harmOsc.type = 'sine';
                    harmOsc.frequency.setValueAtTime(100 * (i + 1), audioContext.currentTime + i * 0.5);
                    harmOsc.frequency.exponentialRampToValueAtTime(200 * (i + 1), audioContext.currentTime + omniDuration);
                    harmGain.gain.setValueAtTime(0, audioContext.currentTime + i * 0.5);
                    harmGain.gain.linearRampToValueAtTime(0.1 / (i + 1), audioContext.currentTime + i * 0.5 + 0.3);
                    harmGain.gain.linearRampToValueAtTime(0, audioContext.currentTime + omniDuration);
                    harmOsc.connect(harmGain);
                    harmGain.connect(audioContext.destination);
                    harmOsc.start(audioContext.currentTime + i * 0.5);
                    harmOsc.stop(audioContext.currentTime + omniDuration);
                    transformationOscillators.push(harmOsc);
                }

                // High shimmer
                const shimmerOsc = audioContext.createOscillator();
                const shimmerGain = audioContext.createGain();
                shimmerOsc.type = 'sine';
                shimmerOsc.frequency.setValueAtTime(2000, audioContext.currentTime + 2);
                shimmerOsc.frequency.linearRampToValueAtTime(4000, audioContext.currentTime + omniDuration);
                shimmerGain.gain.setValueAtTime(0, audioContext.currentTime + 2);
                shimmerGain.gain.linearRampToValueAtTime(0.05, audioContext.currentTime + 3);
                shimmerGain.gain.linearRampToValueAtTime(0, audioContext.currentTime + omniDuration);
                shimmerOsc.connect(shimmerGain);
                shimmerGain.connect(audioContext.destination);
                shimmerOsc.start(audioContext.currentTime + 2);
                shimmerOsc.stop(audioContext.currentTime + omniDuration);
                transformationOscillators.push(shimmerOsc);
            }
        }

        function playPowerUpTick() {
            if (!audioContext || !CONFIG.sound) return;

            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'sine';
            osc.frequency.value = 400 + (powerLevel / POWER_CONFIG.maxPower) * 600;
            gain.gain.setValueAtTime(0.03, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.05);
        }

        function playPowerDecaySound() {
            if (!audioContext || !CONFIG.sound) return;

            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.3);
            gain.gain.setValueAtTime(0.05, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.3);
        }

        // ============================================
        // POWER LEVEL SYSTEM FUNCTIONS
        // ============================================

        function initPowerLevelSystem() {
            // Get DOM elements
            powerValueEl = document.getElementById('powerValue');
            powerBarEl = document.getElementById('powerBar');
            scouterFrameEl = document.getElementById('scouterFrame');
            transformNameEl = document.getElementById('transformationName');
            transformFlashEl = document.getElementById('transformFlash');
            chargingOverlayEl = document.getElementById('chargingOverlay');
            transformAnnounceEl = document.getElementById('transformAnnounce');
            decayWarningEl = document.getElementById('decayWarning');
            auraContainerEl = document.getElementById('auraContainer');
            powerScouterEl = document.getElementById('powerScouter');

            // Initial display update
            updatePowerDisplay();

            // Start passive power gain and decay loop
            setInterval(processPowerTick, 1000 / 60); // 60 FPS

            console.log('%cPOWER LEVEL SYSTEM INITIALIZED', 'color: #ffd700; font-weight: bold;');
            console.log('%cThresholds:', 'color: #00ff88;');
            console.log('  Super DVD:      9,001 (IT\'S OVER 9000!)');
            console.log('  Super DVD 2:    50,000');
            console.log('  Super DVD 3:    150,000 (GROUND SHAKES!)');
            console.log('  Ultra Instinct: 500,000');
            console.log('  LEGENDARY:      1,000,000');
        }

        function addPower(amount, source = 'unknown') {
            const multiplier = 1 + (currentStreak * 0.1); // Streak bonus
            const adjustedAmount = Math.floor(amount * multiplier);

            const oldPower = powerLevel;
            powerLevel = Math.min(powerLevel + adjustedAmount, POWER_CONFIG.maxPower);

            // Track peak
            if (powerLevel > peakPowerLevel) {
                peakPowerLevel = powerLevel;
            }

            // Check for transformation
            checkTransformation();

            // Update display
            updatePowerDisplay();

            // Sound effect for significant gains
            if (adjustedAmount > 500) {
                playPowerUpTick();
            }

            // Log significant power gains
            if (adjustedAmount >= 1000) {
                console.log(`%cPOWER +${adjustedAmount.toLocaleString()} (${source})`, 'color: #ffd700;');
            }
        }

        function removePower(amount) {
            const oldPower = powerLevel;
            powerLevel = Math.max(0, powerLevel - amount);

            // Check for de-transformation
            checkTransformation();

            // Update display
            updatePowerDisplay();
        }

        function processPowerTick() {
            const now = Date.now();

            // Passive power gain (very slow)
            if (powerLevel < POWER_CONFIG.thresholds.superDvd) {
                powerLevel += POWER_CONFIG.passivePowerRate / 60;
            }

            // Power decay for high power levels
            if (powerLevel > POWER_CONFIG.decayStartThreshold && now > powerLockUntil) {
                const decayMultiplier = POWER_CONFIG.transformationDecayMultiplier[currentTransformation] || 1;
                const decayAmount = (POWER_CONFIG.decayRate * decayMultiplier) / 60;

                if (decayAmount > 0) {
                    powerLevel = Math.max(0, powerLevel - decayAmount);

                    // Show decay warning
                    if (currentTransformation !== 'base' && currentTransformation !== 'superDvd') {
                        decayWarningEl.classList.add('active');
                    }
                }
            } else {
                decayWarningEl.classList.remove('active');
            }

            // Check transformation on decay
            checkTransformation();

            // Update display
            updatePowerDisplay();
        }

        function checkTransformation() {
            if (isTransforming) return;

            const now = Date.now();
            if (now - lastTransformationTime < POWER_CONFIG.transformationCooldown) return;

            let newTransformation = 'base';

            // Check thresholds from highest to lowest
            if (powerLevel >= POWER_CONFIG.thresholds.omniDvd) {
                newTransformation = 'omniDvd';  // SECRET ULTIMATE FORM
            } else if (powerLevel >= POWER_CONFIG.thresholds.legendary) {
                newTransformation = 'legendary';
            } else if (powerLevel >= POWER_CONFIG.thresholds.ultraInstinct) {
                newTransformation = 'ultraInstinct';
            } else if (powerLevel >= POWER_CONFIG.thresholds.superDvd3) {
                newTransformation = 'superDvd3';
            } else if (powerLevel >= POWER_CONFIG.thresholds.superDvd2) {
                newTransformation = 'superDvd2';
            } else if (powerLevel >= POWER_CONFIG.thresholds.superDvd) {
                newTransformation = 'superDvd';
            }

            if (newTransformation !== currentTransformation) {
                triggerTransformation(newTransformation);
            }
        }

        function triggerTransformation(newTransformation) {
            const oldTransformation = currentTransformation;
            const isAscending = getTransformationTier(newTransformation) > getTransformationTier(oldTransformation);

            isTransforming = true;
            lastTransformationTime = Date.now();

            const trans = TRANSFORMATIONS[newTransformation];

            // Only show dramatic effects when powering UP
            if (isAscending && trans.announcement) {
                // Flash effect
                transformFlashEl.classList.add('active');
                setTimeout(() => transformFlashEl.classList.remove('active'), 1000);

                // Announcement
                transformAnnounceEl.textContent = trans.announcement;
                transformAnnounceEl.style.color = trans.color;
                transformAnnounceEl.classList.add('active');
                setTimeout(() => transformAnnounceEl.classList.remove('active'), 2000);

                // Lore achievements for transformations
                if (newTransformation === 'superDvd') unlockLoreAchievement('over_9000');
                if (newTransformation === 'superDvd3') unlockLoreAchievement('ssj3');
                showLoreFragment('transformation');

                // Create celebration fireworks for transformation
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        createFireworks(
                            Math.random() * window.innerWidth,
                            Math.random() * window.innerHeight
                        );
                    }, i * 300);
                }

                // Play transformation sound
                playTransformationSound(newTransformation);

                // Screen shake for dramatic transformations
                if (trans.groundShake && CONFIG.shake) {
                    document.body.classList.add('ground-shake');
                    setTimeout(() => document.body.classList.remove('ground-shake'), 2000);
                }

                // Log to console
                console.log(`%c${'='.repeat(40)}`, `color: ${trans.color};`);
                console.log(`%cTRANSFORMATION: ${trans.name}`, `color: ${trans.color}; font-size: 20px; font-weight: bold;`);
                console.log(`%cPower Level: ${Math.floor(powerLevel).toLocaleString()}`, `color: ${trans.color};`);
                console.log(`%c${'='.repeat(40)}`, `color: ${trans.color};`);
            }

            // Update current transformation
            currentTransformation = newTransformation;

            // Apply visual changes
            applyTransformationVisuals(newTransformation);

            // Track history
            transformationHistory.push({
                transformation: newTransformation,
                powerLevel: powerLevel,
                timestamp: Date.now()
            });

            // End transformation lock after effects
            setTimeout(() => {
                isTransforming = false;
            }, isAscending ? 2000 : 500);
        }

        function getTransformationTier(transformation) {
            const tiers = {
                'base': 0,
                'superDvd': 1,
                'superDvd2': 2,
                'superDvd3': 3,
                'ultraInstinct': 4,
                'legendary': 5,
                'omniDvd': 6  // THE ULTIMATE TIER
            };
            return tiers[transformation] || 0;
        }

        function applyTransformationVisuals(transformation) {
            const trans = TRANSFORMATIONS[transformation];
            const realityDistortionEl = document.getElementById('realityDistortion');

            // Update logo classes
            logo.classList.remove('super-dvd', 'super-dvd-2', 'super-dvd-3', 'ultra-instinct', 'legendary', 'omni-dvd');
            if (trans.logoClass) {
                logo.classList.add(trans.logoClass);
            }

            // Update aura
            updateAura(transformation);

            // Update scouter display
            scouterFrameEl.className = `scouter-frame ${trans.scouterClass}`;
            transformNameEl.textContent = trans.name;

            // Apply speed multiplier
            const baseSpeed = CONFIG.baseSpeed;
            const newSpeed = baseSpeed * trans.speedMultiplier;
            dx = (dx > 0 ? 1 : -1) * newSpeed;
            dy = (dy > 0 ? 1 : -1) * newSpeed;

            // Ground shake for SSJ3, Legendary, and OMNI
            if (trans.groundShake) {
                document.body.classList.add('ground-shake');
            } else {
                document.body.classList.remove('ground-shake');
            }

            // Reality distortion for OMNI DVD
            if (trans.realityDistortion && realityDistortionEl) {
                realityDistortionEl.classList.add('active');
            } else if (realityDistortionEl) {
                realityDistortionEl.classList.remove('active');
            }
        }

        function updateAura(transformation) {
            const trans = TRANSFORMATIONS[transformation];

            // Clear existing aura
            auraContainerEl.innerHTML = '';
            auraContainerEl.className = 'aura-container';

            if (transformation !== 'base') {
                const aura = document.createElement('div');
                aura.className = trans.auraClass;
                auraContainerEl.appendChild(aura);

                // Add energy particles for higher forms
                if (getTransformationTier(transformation) >= 2) {
                    spawnEnergyParticles(transformation);
                }
            }
        }

        function spawnEnergyParticles(transformation) {
            const trans = TRANSFORMATIONS[transformation];
            const particleCount = getTransformationTier(transformation) * 3;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'energy-particle';
                particle.style.background = trans.color;
                particle.style.boxShadow = `0 0 10px ${trans.color}`;

                // Random position around the aura
                const angle = (i / particleCount) * Math.PI * 2;
                const radius = 60 + Math.random() * 40;
                particle.style.left = `${50 + Math.cos(angle) * radius}%`;
                particle.style.top = `${50 + Math.sin(angle) * radius}%`;

                // Animation
                particle.style.animation = `energyOrbit ${2 + Math.random()}s linear infinite`;

                auraContainerEl.appendChild(particle);
            }
        }

        function updatePowerDisplay() {
            if (!powerValueEl) return;

            // Update power value with animation
            const displayValue = Math.floor(powerLevel);
            powerValueEl.textContent = displayValue.toLocaleString();

            // Update power bar (percentage to next transformation)
            const currentThreshold = TRANSFORMATIONS[currentTransformation].threshold;
            const nextThreshold = getNextThreshold();

            if (nextThreshold) {
                const progress = ((powerLevel - currentThreshold) / (nextThreshold - currentThreshold)) * 100;
                powerBarEl.style.width = `${Math.min(100, Math.max(0, progress))}%`;
            } else {
                powerBarEl.style.width = '100%';
            }

            // Update scouter visibility
            powerScouterEl.style.display = showPowerScouter ? 'block' : 'none';
        }

        function getNextThreshold() {
            const thresholds = Object.values(POWER_CONFIG.thresholds).sort((a, b) => a - b);
            for (const threshold of thresholds) {
                if (threshold > powerLevel) return threshold;
            }
            return null;
        }

        function lockPowerDecay(duration) {
            powerLockUntil = Date.now() + duration;
        }

        // ============================================
        // FIREWORKS PARTICLE SYSTEM
        // ============================================
        let particles = [];

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 0.5) * 15;
                this.life = 1;
                this.decay = 0.02 + Math.random() * 0.02;
                this.size = 3 + Math.random() * 4;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.3; // Gravity
                this.life -= this.decay;
                this.size *= 0.98;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createFireworks(x, y) {
            if (!CONFIG.fireworks) return;

            const colors = CONFIG.colors;
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
            }
        }

        function updateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
        }

        // ============================================
        // THE PROPHECY - Corner Proximity Detection
        // ============================================
        function calculateCornerProximity() {
            const logoWidth = logo.offsetWidth;
            const logoHeight = logo.offsetHeight;
            const maxX = window.innerWidth - logoWidth;
            const maxY = window.innerHeight - logoHeight;

            // Calculate distance to each corner
            const corners = [
                { x: 0, y: 0 },
                { x: maxX, y: 0 },
                { x: 0, y: maxY },
                { x: maxX, y: maxY }
            ];

            let minDist = Infinity;
            corners.forEach(corner => {
                const dist = Math.sqrt(Math.pow(x - corner.x, 2) + Math.pow(y - corner.y, 2));
                minDist = Math.min(minDist, dist);
            });

            // Normalize to 0-1 (closer = higher)
            const maxDist = Math.sqrt(Math.pow(maxX/2, 2) + Math.pow(maxY/2, 2));
            return 1 - Math.min(minDist / (maxDist * 0.3), 1);
        }

        function checkProphecy() {
            const proximity = calculateCornerProximity();

            // Update tension drone
            updateTensionDrone(proximity);

            // Show prophecy indicator when very close
            if (proximity > 0.85) {
                prophecyEl.classList.add('active');
                // Dynamic prophecy text from lore system
                if (Math.random() < 0.05) {
                    const prophecyText = getProphecy('imminent');
                    prophecyEl.innerHTML = prophecyText + '<br><span style="font-size: 14px;">The corner approaches...</span>';
                }

                // ========== POWER LEVEL SYSTEM ==========
                // Gain power during prophecy (tension building!)
                addPower(POWER_CONFIG.prophecyPower, 'prophecy');
                // ========================================
            } else {
                prophecyEl.classList.remove('active');
            }

            // ========== POWER LEVEL SYSTEM ==========
            // Near-miss power (proximity > 0.5 means reasonably close)
            if (proximity > 0.5 && proximity < 0.85) {
                addPower(POWER_CONFIG.nearMissPower * proximity, 'near-miss');
            }
            // ========================================

            return proximity;
        }

        // ============================================
        // MIDNIGHT MODE (3AM - 3:15AM)
        // ============================================
        function checkMidnightMode() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();

            if (hours === 3 && minutes < 15) {
                document.body.classList.add('midnight-mode');
                // Lore achievement for midnight witness
                unlockLoreAchievement('midnight_witness');
                // Midnight lore fragment chance

                // Occasionally reverse direction (spooky!)
                if (Math.random() < 0.001) {
                    dx = -dx;
                    dy = -dy;
                }
            } else {
                document.body.classList.remove('midnight-mode');
            }
        }

        // ============================================
        // KONAMI CODE
        // ============================================
        function checkKonamiCode(key) {
            if (key === KONAMI_CODE[konamiProgress]) {
                konamiProgress++;
                if (konamiProgress === KONAMI_CODE.length) {
                    activateKonamiMode();
                    konamiProgress = 0;
                }
            } else {
                konamiProgress = 0;
            }
        }

        function activateKonamiMode() {
            konamiActive = true;
            console.log('🎮 KONAMI CODE ACTIVATED! Rainbow mode for 30 seconds!');

            // Lore achievement
            unlockLoreAchievement('konami_master');

            // Rainbow cycling mode
            const originalColors = [...CONFIG.colors];
            CONFIG.colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#9400d3'];

            // Speed boost
            dx *= 1.5;
            dy *= 1.5;

            // Create celebration fireworks
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createFireworks(Math.random() * window.innerWidth, Math.random() * window.innerHeight);
                }, i * 200);
            }

            setTimeout(() => {
                konamiActive = false;
                CONFIG.colors = originalColors;
                dx /= 1.5;
                dy /= 1.5;
            }, 30000);
        }

        // ============================================
        // COLOR MANAGEMENT
        // ============================================
        function nextColor() {
            currentColorIndex = (currentColorIndex + 1) % CONFIG.colors.length;
            const newColor = CONFIG.colors[currentColorIndex];
            logoGroup.style.color = newColor;
            document.documentElement.style.setProperty('--glow-color', newColor);
        }

        // ============================================
        // CORNER HIT DETECTION
        // ============================================
        function handleCornerHit() {
            cornerHits++;
            cornerHitsEl.textContent = cornerHits;

            // Update streak
            currentStreak++;
            if (currentStreak > bestStreak) {
                bestStreak = currentStreak;
                bestStreakEl.textContent = bestStreak;
            }

            // Reset drought
            droughtCounter = 0;
            droughtEl.textContent = '0 bounces';

            // ========== POWER LEVEL SYSTEM ==========
            // MASSIVE power gain from corner hit!
            const streakBonus = Math.pow(POWER_CONFIG.streakMultiplier, currentStreak - 1);
            const powerGain = Math.floor(POWER_CONFIG.cornerHitPower * streakBonus);
            addPower(powerGain, `CORNER HIT x${currentStreak}`);

            // Lock power decay after corner hit
            lockPowerDecay(POWER_CONFIG.cornerPowerLockDuration);

            // Extra fireworks based on transformation tier
            const extraFireworks = getTransformationTier(currentTransformation);
            for (let i = 0; i < extraFireworks; i++) {
                setTimeout(() => {
                    createFireworks(
                        Math.random() * window.innerWidth,
                        Math.random() * window.innerHeight
                    );
                }, i * 200);
            }
            // ========================================

            // Visual celebration
            logo.classList.add('corner-hit');
            setTimeout(() => logo.classList.remove('corner-hit'), 500);

            // Screen shake
            if (CONFIG.shake) {
                document.body.classList.add('screen-shake');
                setTimeout(() => document.body.classList.remove('screen-shake'), 400);
            }

            // Fireworks!
            const rect = logo.getBoundingClientRect();
            createFireworks(rect.left + rect.width/2, rect.top + rect.height/2);

            // Audio
            playCornerChime();

            // Color burst
            nextColor();
            setTimeout(nextColor, 100);
            setTimeout(nextColor, 200);

            // Check for Rick Roll on corner hit
            checkRickRoll();

            // ========== LORE SYSTEM ==========
            checkCornerLore();
            checkLoreMilestones(cornerHits);
            if (currentStreak >= 3) showLoreFragment('streak');
            // =================================

            console.log('🎉 CORNER HIT! Total:', cornerHits, '| Streak:', currentStreak, '| Power:', Math.floor(powerLevel).toLocaleString());
        }

        function handleEdgeHit() {
            edgeHits++;
            droughtCounter++;
            currentStreak = 0; // Reset corner streak on edge hit

            edgeHitsEl.textContent = edgeHits;
            droughtEl.textContent = `${droughtCounter} bounces`;

            // ========== POWER LEVEL SYSTEM ==========
            // Small power gain from edge hit
            addPower(POWER_CONFIG.edgeHitPower, 'edge hit');
            // ========================================

            // ========== LORE SYSTEM ==========
            // Random lore fragment chance on bounce
            if (Math.random() < 0.004) showLoreFragment('random');
            // Drought lore after 50+ bounces without corner
            if (droughtCounter === 50) {
                showLoreFragment('drought');
                unlockLoreAchievement('drought_survivor');
            }
            // =================================

            nextColor();
            playEdgeTap();
        }

        // ============================================
        // MAIN ANIMATION LOOP
        // ============================================
        function animate() {
            const logoWidth = logo.offsetWidth;
            const logoHeight = logo.offsetHeight;
            const maxX = window.innerWidth - logoWidth;
            const maxY = window.innerHeight - logoHeight;

            // Update position
            x += dx;
            y += dy;

            let hitX = false;
            let hitY = false;

            // Bounce detection
            if (x >= maxX) { x = maxX; dx = -dx; hitX = true; }
            else if (x <= 0) { x = 0; dx = -dx; hitX = true; }

            if (y >= maxY) { y = maxY; dy = -dy; hitY = true; }
            else if (y <= 0) { y = 0; dy = -dy; hitY = true; }

            // Handle hits
            if (hitX && hitY) {
                handleCornerHit();
            } else if (hitX || hitY) {
                handleEdgeHit();
            }

            // Update prophecy/tension
            checkProphecy();

            // Apply position
            logo.style.left = x + 'px';
            logo.style.top = y + 'px';

            // ========== POWER LEVEL SYSTEM ==========
            // Position aura to follow logo
            if (auraContainerEl) {
                auraContainerEl.style.left = (x + logoWidth / 2) + 'px';
                auraContainerEl.style.top = (y + logoHeight / 2) + 'px';
            }
            // ========================================

            // Update particles
            updateParticles();

            requestAnimationFrame(animate);
        }

        // ============================================
        // CONFIG PANEL
        // ============================================
        function setupConfigPanel() {
            document.getElementById('themeSelect').value = CONFIG.theme;
            document.getElementById('soundToggle').checked = CONFIG.sound;
            document.getElementById('droneToggle').checked = CONFIG.drone;
            document.getElementById('shakeToggle').checked = CONFIG.shake;
            document.getElementById('fireworksToggle').checked = CONFIG.fireworks;

            document.getElementById('themeSelect').addEventListener('change', (e) => {
                CONFIG.theme = e.target.value;
                document.body.className = `theme-${CONFIG.theme}`;
                CONFIG.colors = CONFIG.themes[CONFIG.theme] || CONFIG.themes.classic;
            });

            document.getElementById('soundToggle').addEventListener('change', (e) => {
                CONFIG.sound = e.target.checked;
            });

            document.getElementById('droneToggle').addEventListener('change', (e) => {
                CONFIG.drone = e.target.checked;
                if (!CONFIG.drone && droneGain) {
                    droneGain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.1);
                }
            });

            document.getElementById('shakeToggle').addEventListener('change', (e) => {
                CONFIG.shake = e.target.checked;
            });

            document.getElementById('fireworksToggle').addEventListener('change', (e) => {
                CONFIG.fireworks = e.target.checked;
            });
        }

        // EVENT LISTENERS
        // ============================================
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const maxX = window.innerWidth - logo.offsetWidth;
            const maxY = window.innerHeight - logo.offsetHeight;
            if (x > maxX) x = maxX;
            if (y > maxY) y = maxY;
            if (x < 0) x = 0;
            if (y < 0) y = 0;
        });

        document.addEventListener('keydown', (e) => {
            // Check Konami code
            checkKonamiCode(e.key);

            switch(e.key.toLowerCase()) {
                case 's':
                    statsEl.classList.toggle('visible');
                    break;
                case '?':
                    configPanel.classList.toggle('visible');
                    break;
                case 'arrowup':
                    if (!KONAMI_CODE.includes(e.key) || konamiProgress === 0) {
                        dx = dx > 0 ? dx + 0.5 : dx - 0.5;
                        dy = dy > 0 ? dy + 0.5 : dy - 0.5;
                        currentSpeedEl.textContent = Math.abs(dx).toFixed(1);
                    }
                    break;
                case 'arrowdown':
                    if (!KONAMI_CODE.includes(e.key) || konamiProgress === 0) {
                        if (Math.abs(dx) > 1) {
                            dx = dx > 0 ? dx - 0.5 : dx + 0.5;
                            dy = dy > 0 ? dy - 0.5 : dy + 0.5;
                            currentSpeedEl.textContent = Math.abs(dx).toFixed(1);
                        }
                    }
                    break;
                case 'c':
                    nextColor();
                    break;
                case 'r':
                    edgeHits = 0;
                    cornerHits = 0;
                    droughtCounter = 0;
                    currentStreak = 0;
                    bestStreak = 0;
                    edgeHitsEl.textContent = '0';
                    cornerHitsEl.textContent = '0';
                    droughtEl.textContent = '0 bounces';
                    bestStreakEl.textContent = '0';
                    break;
                case 'f':
                    // Test fireworks
                    createFireworks(window.innerWidth/2, window.innerHeight/2);
                    break;
                case 'p':
                    // Toggle power scouter display
                    showPowerScouter = !showPowerScouter;
                    updatePowerDisplay();
                    console.log('Power Scouter:', showPowerScouter ? 'VISIBLE' : 'HIDDEN');
                    break;
                case 'l':

                    showAllLore();
                    break;
                case 't':
                    // Show ancient text
                    showAncientText();
                    break;
                case '1':
                    // Debug: Add power to test transformations
                    addPower(10000, 'DEBUG');
                    break;
                case '2':

                    addPower(50000, 'DEBUG');
                    break;
                case '3':

                case '0':

                    powerLevel = 0;

                    console.log('Power Level RESET');
                    break;
                case '9':
                    // Debug: OMNI DVD (secret ultimate form)
                    addPower(5000000, 'DEBUG - OMNI');
                    break;
            }
        });

        console.log('%cTransformation Thresholds:', 'color: #ffd700;');
