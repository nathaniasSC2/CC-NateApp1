<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing DVD Logo - OBS Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
            /* For testing, uncomment the line below */
            /* background: #1a1a2e; */
        }

        .dvd-logo {
            position: absolute;
            width: 150px;
            height: 80px;
            transition: filter 0.1s ease;
        }

        .dvd-logo svg {
            width: 100%;
            height: 100%;
        }

        /* Corner hit celebration effect */
        .corner-hit {
            animation: cornerCelebration 0.5s ease-out;
        }

        @keyframes cornerCelebration {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Stats overlay (optional - can be hidden for clean look) */
        .stats {
            position: fixed;
            top: 10px;
            right: 10px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            display: none; /* Set to 'block' to show stats */
        }

        .stats.visible {
            display: block;
        }

        .corner-count {
            color: #ffd700;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="dvd-logo" id="dvdLogo">
        <svg viewBox="0 0 210 108" xmlns="http://www.w3.org/2000/svg">
            <!-- DVD Logo SVG -->
            <g id="logoGroup" fill="currentColor">
                <!-- D -->
                <path d="M20 20h25c20 0 35 15 35 34s-15 34-35 34H20V20zm15 12v44h10c12 0 20-10 20-22s-8-22-20-22H35z"/>
                <!-- V -->
                <path d="M90 20h15l15 50 15-50h15l-22 68h-16L90 20z"/>
                <!-- D -->
                <path d="M155 20h25c20 0 35 15 35 34s-15 34-35 34h-25V20zm15 12v44h10c12 0 20-10 20-22s-8-22-20-22h-10z"/>
                <!-- Disc icon -->
                <ellipse cx="105" cy="95" rx="25" ry="8" opacity="0.6"/>
                <path d="M80 92c0-3 11-5 25-5s25 2 25 5v3c0 3-11 5-25 5s-25-2-25-5v-3z" opacity="0.4"/>
            </g>
        </svg>
    </div>

    <div class="stats" id="stats">
        <div>Edge Hits: <span id="edgeHits">0</span></div>
        <div>Corner Hits: <span class="corner-count" id="cornerHits">0</span></div>
        <div>Current Speed: <span id="currentSpeed">3</span></div>
    </div>

    <script>
        // Configuration - Tweak these for your perfect setup!
        const CONFIG = {
            // Speed settings (pixels per frame at 60fps)
            baseSpeed: 3,
            // Show stats overlay (press 'S' to toggle)
            showStats: false,
            // Color palette for the logo
            colors: [
                '#ff0055',  // Hot pink
                '#00ff88',  // Neon green
                '#00aaff',  // Electric blue
                '#ffaa00',  // Orange
                '#aa00ff',  // Purple
                '#ffff00',  // Yellow
                '#00ffff',  // Cyan
                '#ff00ff',  // Magenta
                '#ff6600',  // Bright orange
                '#00ff00',  // Lime
            ],
            // Corner hit detection threshold (pixels)
            cornerThreshold: 50,
        };

        // State
        let x = Math.random() * (window.innerWidth - 150);
        let y = Math.random() * (window.innerHeight - 80);
        let dx = CONFIG.baseSpeed * (Math.random() > 0.5 ? 1 : -1);
        let dy = CONFIG.baseSpeed * (Math.random() > 0.5 ? 1 : -1);
        let currentColorIndex = 0;
        let edgeHits = 0;
        let cornerHits = 0;

        // DOM Elements
        const logo = document.getElementById('dvdLogo');
        const logoGroup = document.getElementById('logoGroup');
        const statsEl = document.getElementById('stats');
        const edgeHitsEl = document.getElementById('edgeHits');
        const cornerHitsEl = document.getElementById('cornerHits');
        const currentSpeedEl = document.getElementById('currentSpeed');

        // Set initial color
        logoGroup.style.color = CONFIG.colors[currentColorIndex];

        // Toggle stats visibility
        if (CONFIG.showStats) {
            statsEl.classList.add('visible');
        }

        // Change to next color
        function nextColor() {
            currentColorIndex = (currentColorIndex + 1) % CONFIG.colors.length;
            logoGroup.style.color = CONFIG.colors[currentColorIndex];
        }

        // Check if we hit a corner (both edges at once)
        function checkCornerHit(hitX, hitY) {
            if (hitX && hitY) {
                cornerHits++;
                cornerHitsEl.textContent = cornerHits;
                logo.classList.add('corner-hit');
                setTimeout(() => logo.classList.remove('corner-hit'), 500);

                // Extra color changes for corner hits!
                nextColor();
                setTimeout(nextColor, 100);
                setTimeout(nextColor, 200);

                console.log('🎉 CORNER HIT! Total:', cornerHits);
                return true;
            }
            return false;
        }

        // Animation loop
        function animate() {
            const logoWidth = logo.offsetWidth;
            const logoHeight = logo.offsetHeight;
            const maxX = window.innerWidth - logoWidth;
            const maxY = window.innerHeight - logoHeight;

            // Update position
            x += dx;
            y += dy;

            // Track if we hit edges this frame
            let hitX = false;
            let hitY = false;

            // Bounce off right or left edge
            if (x >= maxX) {
                x = maxX;
                dx = -dx;
                hitX = true;
            } else if (x <= 0) {
                x = 0;
                dx = -dx;
                hitX = true;
            }

            // Bounce off bottom or top edge
            if (y >= maxY) {
                y = maxY;
                dy = -dy;
                hitY = true;
            } else if (y <= 0) {
                y = 0;
                dy = -dy;
                hitY = true;
            }

            // Check for corner hit first (more exciting!)
            if (!checkCornerHit(hitX, hitY)) {
                // Regular edge hit - just change color once
                if (hitX || hitY) {
                    edgeHits++;
                    edgeHitsEl.textContent = edgeHits;
                    nextColor();
                }
            }

            // Apply position
            logo.style.left = x + 'px';
            logo.style.top = y + 'px';

            requestAnimationFrame(animate);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            const maxX = window.innerWidth - logo.offsetWidth;
            const maxY = window.innerHeight - logo.offsetHeight;

            // Keep logo in bounds after resize
            if (x > maxX) x = maxX;
            if (y > maxY) y = maxY;
            if (x < 0) x = 0;
            if (y < 0) y = 0;
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 's':
                    // Toggle stats
                    statsEl.classList.toggle('visible');
                    break;
                case 'arrowup':
                    // Increase speed
                    dx = dx > 0 ? dx + 0.5 : dx - 0.5;
                    dy = dy > 0 ? dy + 0.5 : dy - 0.5;
                    currentSpeedEl.textContent = Math.abs(dx).toFixed(1);
                    break;
                case 'arrowdown':
                    // Decrease speed (minimum 1)
                    if (Math.abs(dx) > 1) {
                        dx = dx > 0 ? dx - 0.5 : dx + 0.5;
                        dy = dy > 0 ? dy - 0.5 : dy + 0.5;
                        currentSpeedEl.textContent = Math.abs(dx).toFixed(1);
                    }
                    break;
                case 'c':
                    // Manual color change
                    nextColor();
                    break;
                case 'r':
                    // Reset stats
                    edgeHits = 0;
                    cornerHits = 0;
                    edgeHitsEl.textContent = '0';
                    cornerHitsEl.textContent = '0';
                    break;
            }
        });

        // Start the animation!
        animate();

        // Log instructions
        console.log('🎬 Bouncing DVD Logo - OBS Overlay');
        console.log('================================');
        console.log('Keyboard Controls:');
        console.log('  S - Toggle stats display');
        console.log('  ↑ - Increase speed');
        console.log('  ↓ - Decrease speed');
        console.log('  C - Change color');
        console.log('  R - Reset stats');
        console.log('================================');
        console.log('For OBS: Add as Browser Source');
        console.log('Recommended: 1920x1080, transparent bg');
    </script>
</body>
</html>
